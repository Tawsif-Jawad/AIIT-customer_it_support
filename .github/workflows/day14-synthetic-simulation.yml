name: Day 14 synthetic simulation (Exception-Gated)
on:
  workflow_dispatch:
    inputs:
      activity:
        description: 'Permitted Day 14 synthetic activity scope'
        required: true
        type: choice
        options:
          - day14-synthetic-simulation
          - day14-full-office-load
          - day14-synthetic-performance
          - day14-enterprise-stress

permissions:
  contents: read

jobs:
  authorization-preflight:
    if: >-
      github.repository == 'Tawsif-Jawad/AIIT-customer_it_support' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/development' &&
      github.workflow_ref == 'Tawsif-Jawad/AIIT-customer_it_support/.github/workflows/day14-synthetic-simulation.yml@refs/heads/development'
    runs-on: ubuntu-24.04
    environment: day14-synthetic-exception
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Fail-closed AIIT-SYNTH-EXC-001 authorization preflight
        env:
          DAY14_ACTIVITY: ${{ inputs.activity }}
        run: node scripts/synthetic/day14-preflight.ts "$DAY14_ACTIVITY"
