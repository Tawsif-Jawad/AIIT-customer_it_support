name: Synthetic enterprise infrastructure
on:
  pull_request:
    paths:
      - 'infra/synthetic-enterprise/**'
      - '.github/workflows/synthetic-enterprise.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keycloak-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: bash infra/synthetic-enterprise/smoke.sh
  samba-ldaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-contrib-16 libnss3-tools
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash infra/synthetic-enterprise/federation.sh
        env:
          PG_BINDIR: /usr/lib/postgresql/16/bin
