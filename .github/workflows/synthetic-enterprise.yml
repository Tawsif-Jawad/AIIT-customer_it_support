name: Synthetic enterprise infrastructure
on:
  push:
    branches:
      - development
    paths:
      - 'infra/synthetic-enterprise/**'
      - 'scripts/synthetic/**'
      - 'docs/development-reports/day13/**'
      - '.github/workflows/synthetic-enterprise.yml'
  pull_request:
    paths:
      - 'infra/synthetic-enterprise/**'
      - '.github/workflows/synthetic-enterprise.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keycloak-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: bash infra/synthetic-enterprise/smoke.sh
  samba-ldaps:
    needs: image-scan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-contrib-16 libnss3-tools
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: selected-samba-runtime
          path: ${{ runner.temp }}/selected-samba-runtime
      - run: |
          mkdir -p federation-evidence
          artifact="$RUNNER_TEMP/selected-samba-runtime"
          docker load -i "$artifact/samba.tar.gz"
          AIIT_SAMBA_SCANNED_ID="$(cat "$artifact/image-id.txt")" bash infra/synthetic-enterprise/federation.sh 2>&1 | tee federation-evidence/federation.log
        env:
          PG_BINDIR: /usr/lib/postgresql/16/bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: federation-evidence
          path: federation-evidence/
          if-no-files-found: warn
  image-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash infra/synthetic-enterprise/scan-images.sh
        env:
          AIIT_SAMBA_EXPORT_DIR: ${{ runner.temp }}/selected-samba-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-samba-runtime
          path: ${{ runner.temp }}/selected-samba-runtime/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-image-security-evidence
          path: image-security-evidence/
          if-no-files-found: error
  samba-bookworm-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: bash infra/synthetic-enterprise/scan-images.sh bookworm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookworm-candidate-security-evidence
          path: image-security-evidence/
          if-no-files-found: error
