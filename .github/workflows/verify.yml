name: Native runtime verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: Node tests and import/syntax smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      AUTH_MODE: dev_oidc
      MAIL_PROVIDER: mock
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install declared Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Run regression and integration tests
        run: npm test
      - name: Check module imports and browser syntax
        run: npm run lint
      - name: Verify native runtime modules
        run: npm run build

# Limitation: lint/build above do not run tsc, ESLint or Playwright.
# Those gates require a reviewed lockfile, installed toolchain and additional CI jobs.
