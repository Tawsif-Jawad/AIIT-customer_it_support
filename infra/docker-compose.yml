version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: itsupport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itsupport_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_DEV_ONLY}
      POSTGRES_DB: ${POSTGRES_DB:-it_support_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-itsupport_app} -d $${POSTGRES_DB:-it_support_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: itsupport-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: itsupport-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-CHANGE_ME_LOCAL_KC_ADMIN}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-it_support_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-itsupport_app}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_DEV_ONLY}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/upstra-enterprise-realm.json:/opt/keycloak/data/import/upstra-enterprise-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: itsupport-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
  redis_data:
